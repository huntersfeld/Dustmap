<title>Dustmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the map fills the whole screen and every control floats over it.
   Top left: map name. Top right: undo, player preview, live session, settings.
   Left: the tool rail (icons only). Bottom: a tray with the active tool's swatches.
   Hover anything for its name, its key and a one-line note.
   Single dark theme by choice: a dim workshop around a bright desert map. */
:root{
  --bg:#1d1b22; --panel:#26232c; --raised:#322e3a; --line:#3d3846;
  --fg:#efe9e4; --muted:#a9a2b2; --accent:#f2c49f; --rust:#c4563e; --rust-hi:#d96a50; --live:#7fd07a;
  --glass:rgba(38,35,44,.94); --shadow:0 8px 24px rgba(0,0,0,.45);
  --display:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --ui:"Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gap:max(12px,env(safe-area-inset-left,0px));--gapr:max(12px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{position:relative;height:100%;overflow:hidden}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#5a5266}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--rust);border-color:var(--rust)}
.btn.primary:hover{background:var(--rust-hi)}
.btn.warn{background:#5a2a24;border-color:#8a3a2e}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--raised);color:var(--fg)}
.btn svg{width:16px;height:16px;flex:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:ui-monospace,monospace;font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
/* floating chrome */
.float{position:absolute;z-index:5;background:var(--glass);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--fg);padding:0;position:relative;flex:none}
.ib:hover{background:var(--raised)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib svg{width:20px;height:20px}
.ib[aria-pressed="true"]{background:var(--rust);color:#fff}
.ib.danger{color:#f0a493}
.topl{top:max(10px,env(safe-area-inset-top,0px));left:var(--gap);display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;max-width:calc(100% - 300px)}
.brand{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);letter-spacing:.02em;line-height:1}
#libbtn{display:flex;align-items:center;gap:6px;min-width:0;background:transparent;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;font-weight:600}
#libbtn:hover{background:var(--raised)}
#libname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#libbtn .chev{color:var(--muted);font-size:10px}
.topr{top:max(10px,env(safe-area-inset-top,0px));right:var(--gapr);display:flex;align-items:center;gap:2px;padding:4px}
.vsep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.mpbtn{height:36px;border:0;border-radius:8px;padding:0 12px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px;background:var(--raised)}
.mpbtn:hover{background:#3d3846}
.mpbtn.live{background:#2b3a2b;color:#d8f0d3}
.mpbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(127,208,122,.18)}
.menuwrap{position:relative}
.menu{position:absolute;right:-4px;top:calc(100% + 10px);z-index:15;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;
  box-shadow:0 12px 32px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;text-align:left;font-size:13px}
.menu .mi:hover{background:var(--raised)}
.menu .mi.warn{color:#f0a493}
.menu .mi.warn.armed{background:#5a2a24;color:var(--fg)}
.menu .mi kbd{margin-left:auto}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px;width:auto}
.menu .mrow{display:flex;align-items:center;gap:10px;padding:5px 10px;font-size:13px}
.menu .mrow>span:first-child{flex:none;width:72px;color:var(--muted)}
.menu .mrow select,.menu .mrow input[type=range]{flex:1;min-width:0}
/* tool rail */
.rail{left:var(--gap);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;padding:5px;max-height:calc(100% - 140px);overflow-y:auto;scrollbar-width:none}
.rail .ib{width:44px;height:44px}
.rail .ib svg{width:22px;height:22px}
.rail .hsep{height:1px;width:28px;background:var(--line);margin:4px auto;flex:none}
/* swatch tray */
.tray{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:5px;max-width:calc(100% - 150px);display:flex}
.trayin{display:flex;align-items:center;gap:3px;overflow-x:auto;scrollbar-width:thin;min-width:0}
.tray .pane{display:flex;align-items:center;gap:3px;flex:none}
.sw{width:46px;height:46px;flex:none;border-radius:9px;display:grid;place-items:center;position:relative;border:2px solid transparent;background:transparent;cursor:pointer;padding:0;color:var(--fg)}
.sw:hover{background:var(--raised)}
.sw[aria-pressed="true"]{border-color:var(--accent);background:var(--raised)}
.sw canvas{width:36px;height:36px;border-radius:5px;image-rendering:pixelated;background:#f0cab8}
.sw canvas.objsw{image-rendering:auto}
.sw.tok canvas{width:40px;height:40px;background:transparent}
.sw.var{width:34px;height:46px}
.sw.var canvas{width:30px;height:30px}
/* a character's colours, stacked above its tray swatch */
.tokvars{display:flex;flex-direction:column;gap:2px;padding:4px;z-index:7}
.tokvars .sw.var{width:46px;height:42px}
.tokvars .sw.var canvas{width:34px;height:34px}
.sw.tok.many::after{content:'';position:absolute;top:3px;right:4px;border:4px solid transparent;border-bottom:5px solid var(--muted);border-top:0}
.sw.tok.many[aria-expanded="true"]::after{border-bottom-color:var(--accent)}
.sw .k{position:absolute;top:1px;left:4px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
.sw svg{width:22px;height:22px}
.sw .del{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:11px;line-height:14px;color:var(--muted);display:none}
.sw:hover .del{display:block}
.tsep{width:1px;height:32px;background:var(--line);margin:0 4px;flex:none}
.seg{display:flex;gap:2px;background:var(--bg);border-radius:9px;padding:3px;flex:none}
.seg button{height:38px;min-width:38px;padding:0 8px;border:0;border-radius:7px;display:grid;place-items:center;background:transparent;cursor:pointer;color:var(--muted);font-weight:600;font-size:12px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg)}
.seg svg{width:18px;height:18px}
.seg.walkr{align-items:center}.seg.walkr button{min-width:30px;font-size:16px}.seg.walkr span{min-width:38px;text-align:center;font-size:12px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}.seg[hidden]{display:none}
.seg.col{flex-direction:column;padding:2px}
.seg.col button{height:22px;font-size:11px;padding:0 8px}
.seg .dot{display:block;border-radius:50%;background:currentColor}
.trnote{font-size:12px;color:var(--muted);padding:0 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.gbadge{position:absolute;bottom:2px;right:3px;font-size:10px;font-weight:600;color:var(--accent)}
/* grid / mix popover above the tray */
.pop{position:absolute;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px;width:250px}
.placemode button{flex:1;height:30px}
.arrange{display:flex;gap:10px;align-items:flex-start}
.arrange .side{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.gridpick{display:grid;grid-template-columns:repeat(6,13px);gap:2px;padding:3px;background:var(--bg);border-radius:6px;touch-action:none;user-select:none;flex:none}
.gridpick span{width:13px;height:13px;border:1px solid var(--line);border-radius:2px;cursor:pointer}
.gridpick span:hover{border-color:var(--rust-hi)}
.gridpick span.on{background:var(--rust);border-color:var(--rust-hi)}
.btn.sm{padding:3px 8px;font-size:12px}
input[type=range]{width:100%;accent-color:var(--rust)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{accent-color:var(--rust);width:15px;height:15px;margin:0}
.row{display:flex;align-items:center;gap:8px}
/* zoom */
.zoom{right:var(--gapr);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;padding:4px;gap:1px}
.zoom .ib{width:34px;height:32px;font-size:18px;font-weight:600}
#zlabel{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding:2px 0}
/* map */
.stage{position:absolute;inset:0;background:#120f14}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#map.pan{cursor:grab}
#map.select{cursor:default}
select{background:var(--raised);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px}
/* status chip: only while something is in progress (a shape being drawn, a sculpt, what's selected) */
.hint{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 150px);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;color:var(--muted);font-size:12px;box-shadow:var(--shadow)}
body.notray .hint{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.hint:empty{display:none}
.hint .btn{padding:3px 10px;font-size:12px;border-radius:999px}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
/* selection actions float above whatever is selected */
.selbar{position:absolute;z-index:6;display:flex;gap:2px;padding:4px;transform:translate(-50%,-100%)}
.selbar .ib{width:34px;height:34px}
.selbar .ib svg{width:18px;height:18px}
/* right-click quick menu */
.qmenu{position:absolute;z-index:9;display:flex;flex-direction:column;gap:1px;padding:5px;min-width:180px}
.qmenu button{display:flex;align-items:center;gap:10px;padding:7px 10px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-size:13px;text-align:left;white-space:nowrap}
.qmenu button:hover{background:var(--raised)}
.qmenu svg,.qmenu canvas{width:18px;height:18px;flex:none;image-rendering:pixelated}
.qmenu .danger{color:#f0a493}
.signcard{position:absolute;z-index:7;pointer-events:none;transform:translate(-50%,-100%);display:flex;flex-direction:column-reverse;align-items:center;gap:5px;max-width:min(320px,calc(100% - 16px))}
.signcard .plank{position:relative;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 5px,rgba(90,54,30,.12) 5px 6px),linear-gradient(#cfa068,#b8864f);border:3px solid #5c3b24;border-radius:2px;
  box-shadow:inset 0 2px 0 rgba(255,230,180,.35),0 3px 0 #3e2716,0 10px 22px rgba(0,0,0,.45);padding:9px 13px;color:#3a2414;font-family:var(--display);font-weight:500;font-size:15px;line-height:1.3;
  white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;max-width:100%}
.signcard .plank::before,.signcard .plank::after{content:"";position:absolute;top:4px;width:4px;height:4px;background:#5c3b24;border-radius:1px}
.signcard .plank::before{left:4px}.signcard .plank::after{right:4px}
.signcard .plank.blank{font-family:var(--ui);font-size:12px;font-style:italic;color:#5c3b24}
.signcard canvas{display:block;image-rendering:pixelated;max-width:100%}
.sgtr{background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;line-height:1.4;color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow);max-width:100%}
.sgtr b{color:var(--accent);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-right:7px}
.sgtr i{color:var(--muted)}
.signedit{position:absolute;z-index:8;width:min(280px,calc(100% - 16px));padding:10px;display:flex;flex-direction:column;gap:8px}
.signedit textarea{width:100%;resize:vertical;min-height:58px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:14px/1.35 var(--display)}
.signedit textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.signedit select{flex:1;min-width:0}
.signedit .seg button{height:32px;min-width:34px;padding:0 6px}
.signedit .seg canvas{width:26px;height:auto;image-rendering:pixelated}
#map.onsign{cursor:help}
/* tooltip: name, key, one-line note */
.tip{position:fixed;z-index:30;pointer-events:none;background:#0f0d12;border:1px solid var(--line);border-radius:8px;padding:6px 9px;max-width:240px;font-size:12px;line-height:1.4;box-shadow:var(--shadow)}
.tip b{font-weight:600;color:var(--fg)}
.tip kbd{margin-left:6px}
.tip div{color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.45}
[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(10,8,12,.82);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.modal .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:min(1000px,100%);max-height:100%;overflow:auto}
.modal .card>.row:first-child b{font-size:15px}
.modal img{width:100%;height:auto;image-rendering:pixelated;border-radius:6px}
/* Map library */
.lib{width:min(620px,100%)}
.lib .acts{display:flex;gap:8px;flex-wrap:wrap}
.libmaps{display:flex;flex-direction:column;gap:4px}
.libmap{display:flex;align-items:center;gap:4px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.libmap.cur{border-color:var(--accent);background:var(--raised)}
.libmap .nm{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:1px}
.libmap .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libmap .nm input{background:var(--bg);color:var(--fg);border:1px solid var(--accent);border-radius:5px;padding:4px 6px;font:inherit}
.libmap .btn{padding:4px 8px;font-size:12px}
.libmap .pill{margin-right:6px}
.newmap{width:min(460px,100%)}
.newmap .fld{display:flex;flex-direction:column;gap:6px;font-size:13px}
.newmap .fld>span{color:var(--muted);font-size:12px}
.newmap input,.newmap select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.newmap input:focus{border-color:var(--accent);outline:none}
.newbases{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.basesw{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border-radius:9px;border:2px solid transparent;background:transparent;color:var(--fg);cursor:pointer;font:inherit;font-size:12px}
.basesw:hover{background:var(--raised)}
.basesw[aria-checked="true"]{border-color:var(--accent);background:var(--raised)}
.basesw canvas{width:40px;height:40px;border-radius:6px;image-rendering:pixelated}
.newmap .acts{justify-content:flex-end}
.lib.drop{outline:2px dashed var(--accent);outline-offset:-6px}
#libtext{width:100%;min-height:110px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,monospace;resize:vertical}
#libmsg:empty{display:none}
#libtx summary{cursor:pointer}
/* Play together (multiplayer) */
body.mp-player .dmonly{display:none!important}
.mpbtn.live{border-color:#6fae6a;background:#2b3a2b}
.mpbtn .dot{width:8px;height:8px;border-radius:50%;background:#7fd07a;box-shadow:0 0 0 3px rgba(127,208,122,.18)}
.mpcard{width:min(560px,100%)}
.mpbody{display:flex;flex-direction:column;gap:10px}
.mpbody p{margin:0;line-height:1.5}
.mppeople{display:flex;flex-direction:column;gap:6px}
.mpp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mpp img{width:24px;height:24px;border-radius:50%;flex:none}
.mpp .nm{flex:1 1 140px;min-width:0;display:flex;flex-direction:column;gap:1px}
.mpp .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpp .nm span{font-size:12px;color:var(--muted)}
.mpp.away{opacity:.6}
.mpp .btn{padding:5px 9px;font-size:12px}
.mpacts{display:flex;gap:8px;flex-wrap:wrap}
#mpmsg:empty{display:none}
.mppick{display:flex;flex-wrap:wrap;gap:4px;max-height:240px;overflow:auto}
.mppick .grp{flex-basis:100%}
.mppick .tokbtn{width:44px;height:44px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.mppick .tokbtn canvas{width:32px;height:32px;image-rendering:pixelated}
.mppick .tokbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--raised)}
.mppick .tokbtn:disabled{opacity:.3;cursor:default}
.chcard{width:min(520px,100%)}
.chtop{display:flex;align-items:center;gap:12px}
.chtop img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--bg);image-rendering:auto;flex:none}
.chtop .nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.chtop .nm b{font-family:var(--display);font-size:20px;color:var(--accent)}
.chtop .nm span{color:var(--muted);font-size:13px}
.chstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chstat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.chstat.hp{grid-column:1/-1}
.chstat .lbl,.chab .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chstat b{font-size:18px}
.chstat input{width:100%;min-width:0;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font:600 16px var(--ui)}
.hprow{display:flex;align-items:center;gap:6px}
.hprow input{width:72px;flex:none}
.hprow .of{color:var(--muted);font-size:15px;margin-right:auto}
.hprow .btn{width:32px;justify-content:center;padding:4px}
.hpbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.hpbar i{display:block;height:100%}
.chabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chab{display:flex;flex-direction:column;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 2px}
.chab b{font-size:17px}
.chab .sc{font-size:12px;color:var(--muted)}
.chin{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit}
.chsteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.45}
.chsteps a{color:var(--accent)}
.chpaste{display:block;width:100%;min-height:80px;margin-top:6px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,monospace;resize:vertical}
a.btn{text-decoration:none;color:var(--fg)}
@media (max-width:480px){.chstats{grid-template-columns:repeat(2,1fr)}.chabs{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){
  .brand{display:none}
  .topl{max-width:calc(100% - 262px);padding-left:6px}
  .tray{left:calc(50% + 6px);max-width:calc(100% - 136px)}

// A player pastes their character's link and Dustmap keeps a small summary of the sheet (name, class, HP, AC, scores),

  const stat=(arr,i)=>{const e=Array.isArray(arr)&&arr.find(s=>s&&s.id===i+1);return e?num(e.value):null};
